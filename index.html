:root{--bg:#f6f7fb;--card:#fff;--ink:#15171a;--muted:#727780;--line:#e7e9ee;--accent:#111827}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:auto;padding:28px 16px 50px}
h1{font-size:34px;margin:10px 0 6px} .sub{color:var(--muted);margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 25px rgba(0,0,0,.04)}
h2{font-size:17px;margin:0 0 14px}
.options{display:flex;flex-wrap:wrap;gap:9px}
label.opt{border:1px solid var(--line);padding:10px 13px;border-radius:999px;cursor:pointer;background:#fff}
label.opt:has(input:checked){background:#111827;color:#fff;border-color:#111827}
.opt input{display:none}
button{border:0;border-radius:15px;padding:14px 17px;font-weight:800;font-size:16px;cursor:pointer}
.primary{width:100%;background:#111827;color:#fff;margin-top:10px}
.secondary{background:#eef0f4;color:#111827}
.restaurant{font-size:27px;font-weight:900;margin:8px 0}
.meta{color:var(--muted);line-height:1.6}
.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.actions a{flex:1;text-align:center;text-decoration:none;background:#eef0f4;color:#111827;padding:13px;border-radius:14px;font-weight:800}
.hidden{display:none}
.vs{display:grid;grid-template-columns:1fr 54px 1fr;align-items:stretch;gap:10px}
.choice{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff;cursor:pointer;text-align:left}
.choice:hover{border-color:#111827}
.choice b{font-size:21px;display:block;margin-bottom:8px}
.vsmark{display:flex;align-items:center;justify-content:center;font-weight:900}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.badge{display:inline-block;font-size:12px;padding:5px 8px;background:#eef0f4;border-radius:999px;margin-right:5px}
@media(max-width:560px){.vs{grid-template-columns:1fr}.vsmark{height:28px}.choice{min-height:145px}}

.comments{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.comments h3{margin:0 0 6px;font-size:19px}
.rating-summary{font-weight:800;margin:8px 0 12px}.rating-picker{display:flex;gap:4px;margin:10px 0}.star{border:0;background:transparent;padding:2px;font-size:28px;cursor:pointer;color:#cbd5e1}.star.active{color:#f59e0b}.comment-rating{color:#f59e0b;font-weight:800;margin-bottom:5px}.comment-form{display:grid;grid-template-columns:120px 1fr auto;gap:8px;margin:14px 0}
.comment-form input{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;min-width:0}
.comment-form button{background:#111827;color:white;padding:12px 15px}
.comment-list{display:flex;flex-direction:column;gap:9px}
.comment-item{background:#f6f7fb;border-radius:14px;padding:12px 14px}
.comment-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}
.comment-name{font-weight:800}.comment-time{font-size:12px;color:var(--muted)}
.comment-text{white-space:pre-wrap;word-break:break-word;line-height:1.5}
.comment-empty{color:var(--muted);padding:10px 0}
@media(max-width:560px){.comment-form{grid-template-columns:1fr}.comment-form button{width:100%}}

</style>
</head>

const cats=["전체","한식","고기","중식","일식","양식","분식"];
document.getElementById("categories").innerHTML=cats.map((c,i)=>
 `<label class="opt"><input type="radio" name="cat" value="${c}" ${i===0?"checked":""}>${c}</label>`).join("");

document.getElementById("restaurantCount").textContent=`총 ${restaurants.length}곳`;
let pool=[], champion=null, challenger=null;
window.selectedRating=0;
window.setRating=function(n){
 window.selectedRating=n;
 document.querySelectorAll(".star").forEach(star=>star.classList.toggle("active",Number(star.dataset.rating)<=n));
 const guide=document.getElementById("ratingGuide"); if(guide) guide.textContent=`${n}점 선택됨`;
};

function selected(name){return document.querySelector(`input[name="${name}"]:checked`).value}
function filtered(){
 const cat=selected("cat");
 return restaurants.filter(r=>cat==="전체"||r.cat===cat);
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function mapUrl(r){return "https://map.naver.com/p/search/"+encodeURIComponent((r.mapName||r.name)+" "+(r.region||"상주"))}
function restaurantHtml(r,title="오늘은 여기!"){
 return `<div class="badge">${r.cat}</div>
 <div class="meta" style="margin-top:12px">${title}</div>
 <div class="restaurant">${r.name}</div>
 <div class="meta">🍽️ ${r.menu}<br>📍 ${r.addr}${r.region&&r.region!=="상주"?" · "+r.region+" 식당":""}${r.note?`<br>ℹ️ ${r.note}`:""}</div>
 <div class="actions"><a target="_blank" href="${mapUrl(r)}">🗺️ 네이버지도에서 보기</a></div>
 <div class="comments">
   <h3>💬 ${r.name} 이야기</h3>
   <div id="ratingSummary" class="rating-summary">⭐ 아직 별점이 없어요</div>
   <div class="meta">이 식당에 대한 후기나 팁을 남겨보세요.</div>
   <div class="rating-picker" aria-label="별점 선택">
     ${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-rating="${n}" onclick="setRating(${n})" aria-label="${n}점">★</button>`).join("")}
   </div>
   <div class="meta" id="ratingGuide">별점을 선택해주세요.</div>
   <div class="comment-form">
     <input id="nickname" maxlength="20" placeholder="닉네임">
     <input id="commentText" maxlength="500" placeholder="댓글을 입력하세요">
     <button onclick='addComment(${JSON.stringify(r.name)})'>등록</button>
   </div>
   <div id="commentList" class="comment-list"><div class="comment-empty">댓글을 불러오는 중...</div></div>
 </div>
 <button class="primary" onclick="resetApp()">다시 고르기</button>`;
}
function start(){
 pool=shuffle(filtered());
 if(!pool.length){alert("이 조건에 등록된 식당이 아직 없어요. 다른 조건을 골라주세요.");return}
 document.getElementById("setup").classList.add("hidden");
 if(selected("mode")==="random"){
   const r=pool[Math.floor(Math.random()*pool.length)];
   const el=document.getElementById("result"); el.innerHTML=restaurantHtml(r); el.classList.remove("hidden");
   setTimeout(()=>window.loadComments && window.loadComments(r.name),0);
 } else {
   if(pool.length<2){alert("두 곳을 뽑으려면 후보가 2곳 이상 필요해요.");resetApp();return}
   drawPair();
 }
}
function choiceCard(r,side){
 return `<div class="choice" onclick="pick('${side}')" style="text-align:left">
   <div class="badge">${r.cat}</div>
   <div class="meta" style="margin-top:12px">이곳을 선택하려면 카드를 누르세요</div>
   <div class="restaurant">${r.name}</div>
   <div class="meta">🍽️ ${r.menu}<br>📍 ${r.addr}${r.region&&r.region!=="상주"?" · "+r.region+" 식당":""}${r.note?`<br>ℹ️ ${r.note}`:""}</div>
   <div class="actions"><a target="_blank" href="${mapUrl(r)}" onclick="event.stopPropagation()">🗺️ 네이버지도에서 보기</a></div>
   <button class="primary" type="button" onclick="event.stopPropagation();pick('${side}')">이 식당 선택</button>
 </div>`;
}
function drawPair(){
 const candidates=shuffle(filtered());
 if(candidates.length<2){alert("현재 조건에서는 두 곳 이상이 필요해요.");resetApp();return}
 champion=candidates[0]; challenger=candidates[1];
 renderCup();
}
function renderCup(){
 const el=document.getElementById("cup"); el.classList.remove("hidden");
 el.innerHTML=`<h2>⚔️ 이상형 월드컵</h2>
 <div class="meta">랜덤으로 뽑힌 두 식당 중 마음에 드는 곳을 선택하세요.</div><br>
 <div class="vs">${choiceCard(champion,"champ")}<div class="vsmark">VS</div>${choiceCard(challenger,"chall")}</div>
 <button class="primary" style="margin-top:16px" onclick="resetApp()">다시 고르기</button>`;
}
function pick(side){
 const winner = side==="champ" ? champion : challenger;
 const el=document.getElementById("cup");
 el.innerHTML=restaurantHtml(winner,"✅ 오늘은 여기로 결정!");
 setTimeout(()=>window.loadComments && window.loadComments(winner.name),0);
}
function resetApp(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("cup").classList.add("hidden");
 document.getElementById("setup").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDcHEvn1omJxyy8mHn4QsCn_b05s4Edgi4",
  authDomain: "no-decisions-no-stress.firebaseapp.com",
  projectId: "no-decisions-no-stress",
  storageBucket: "no-decisions-no-stress.firebasestorage.app",
  messagingSenderId: "560240925090",
  appId: "1:560240925090:web:dbedda0172c3d76608bafb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatTime(ts){
  if(!ts || !ts.toDate) return "방금";
  return ts.toDate().toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

window.loadComments = async function(restaurant){
  const list=document.getElementById("commentList");
  if(!list) return;
  list.innerHTML='<div class="comment-empty">댓글을 불러오는 중...</div>';
  try{
    const snap=await getDocs(collection(db,"comments"));
    const docs = snap.docs.filter(d=>d.data().restaurant===restaurant).sort((a,b)=>{
      const at=a.data().createdAt?.toMillis?.() || 0;
      const bt=b.data().createdAt?.toMillis?.() || 0;
      return bt-at;
    });
    const rated=docs.map(d=>Number(d.data().rating)).filter(r=>Number.isInteger(r)&&r>=1&&r<=5);
    const summary=document.getElementById("ratingSummary");
    if(summary){
      if(rated.length){ const avg=rated.reduce((a,b)=>a+b,0)/rated.length; summary.textContent=`⭐ ${avg.toFixed(1)} / 5 (${rated.length}명)`; }
      else summary.textContent="⭐ 아직 별점이 없어요";
    }
    if(docs.length===0){list.innerHTML='<div class="comment-empty">아직 댓글이 없어요. 첫 댓글을 남겨보세요!</div>';return}
    list.innerHTML=docs.map(d=>{
      const x=d.data();
      return `<div class="comment-item">
        <div class="comment-head"><span class="comment-name">${esc(x.nickname)}</span><span class="comment-time">${formatTime(x.createdAt)}</span></div>
        ${Number.isInteger(x.rating)?`<div class="comment-rating">${"★".repeat(x.rating)}${"☆".repeat(5-x.rating)} · ${x.rating}점</div>`:""}
        <div class="comment-text">${esc(x.text)}</div>
      </div>`;
    }).join("");
  }catch(e){
    console.error(e);
    list.innerHTML='<div class="comment-empty">댓글을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>';
  }
};

window.addComment = async function(restaurant){
  const nick=document.getElementById("nickname");
  const text=document.getElementById("commentText");
  const nickname=nick.value.trim(), body=text.value.trim();
  const rating=Number(window.selectedRating||0);
  if(!nickname){alert("닉네임을 입력해주세요.");nick.focus();return}
  if(!rating){alert("별점을 선택해주세요.");return}
  if(!body){alert("댓글을 입력해주세요.");text.focus();return}
  try{
    await addDoc(collection(db,"comments"),{
      restaurant,
      nickname:nickname.slice(0,20),
      text:body.slice(0,500),
      rating,
      createdAt:serverTimestamp()
    });
    text.value="";
    window.selectedRating=0;
    document.querySelectorAll(".star").forEach(star=>star.classList.remove("active"));
    const guide=document.getElementById("ratingGuide"); if(guide) guide.textContent="별점을 선택해주세요.";
    await window.loadComments(restaurant);
  }catch(e){
    console.error(e);
    alert("댓글 등록에 실패했습니다. Firebase 설정을 확인해주세요.");
  }
};
</script>

</body>
